<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#E8E1D8; color:#1A1611; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#1A1611; text-decoration:none; }
a:hover { color:#C8860A; }
input { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; }
</style>
</helmet>
<div data-screen-label="Auth" style="min-height:100vh; color:#1A1611; display:flex; flex-direction:column;">
  <dc-import name="Tanuki Header" hint-size="100%,90px"></dc-import>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:56px;">
    <div style="width:440px; background:rgba(248,244,236,0.55); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.65); border-radius:4px; padding:44px; box-shadow:0 16px 48px -20px rgba(26,22,17,0.2);">
      <div style="display:flex; gap:4px; background:rgba(26,22,17,0.06); border-radius:4px; padding:4px; margin-bottom:32px;">
        <button onClick="{{ goLogin }}" style="flex:1; padding:10px; font-size:13px; border:none; cursor:pointer; border-radius:4px; background:{{ loginTabBg }}; color:{{ loginTabFg }}; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:500;">Connexion</button>
        <button onClick="{{ goRegister }}" style="flex:1; padding:10px; font-size:13px; border:none; cursor:pointer; border-radius:4px; background:{{ regTabBg }}; color:{{ regTabFg }}; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:500;">Créer un compte</button>
      </div>

      <h1 style="font-weight:600; font-size:26px; letter-spacing:-0.02em; margin:0 0 6px;">{{ title }}</h1>
      <p style="font-size:13px; color:rgba(26,22,17,0.65); margin:0 0 28px;">{{ subtitle }}</p>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.16em; color:rgba(26,22,17,0.55);">E-MAIL</label>
          <input onChange="{{ onEmail }}" value="{{ email }}" placeholder="vous@exemple.fr" style="padding:14px 16px; font-size:14px; background:rgba(255,255,255,0.55); border:1px solid {{ emailBorder }}; border-radius:4px; color:#1A1611; box-sizing:border-box; width:100%;">
          <sc-if value="{{ emailErr }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12px; color:#8A2F1D;">Adresse e-mail invalide.</span>
          </sc-if>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.16em; color:rgba(26,22,17,0.55);">MOT DE PASSE</label>
          <input type="password" onChange="{{ onPwd }}" value="{{ pwd }}" placeholder="••••••••" style="padding:14px 16px; font-size:14px; background:rgba(255,255,255,0.55); border:1px solid {{ pwdBorder }}; border-radius:4px; color:#1A1611; box-sizing:border-box; width:100%;">
          <sc-if value="{{ pwdErr }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12px; color:#8A2F1D;">8 caractères minimum.</span>
          </sc-if>
        </div>
        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.16em; color:rgba(26,22,17,0.55);">CONFIRMER LE MOT DE PASSE</label>
            <input type="password" style="padding:14px 16px; font-size:14px; background:rgba(255,255,255,0.55); border:1px solid rgba(26,22,17,0.15); border-radius:4px; color:#1A1611; box-sizing:border-box; width:100%;">
          </div>
        </sc-if>
      </div>

      <button onClick="{{ submit }}" style="width:100%; margin-top:24px; background:#C8860A; color:#FDF9F2; border:none; padding:16px; font-size:15px; cursor:pointer; border-radius:4px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;" style-hover="background:#1A1611; color:#E8E1D8;">{{ cta }}</button>

      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
        <a href="#" style="display:block; text-align:center; font-size:13px; color:rgba(26,22,17,0.6); margin-top:18px;">Mot de passe oublié ?</a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'login', email: '', pwd: '', touched: false };
  renderVals() {
    const login = this.state.mode === 'login';
    const emailErr = this.state.touched && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(this.state.email);
    const pwdErr = this.state.touched && this.state.pwd.length < 8;
    return {
      isLogin: login, isRegister: !login,
      title: login ? 'Bon retour.' : 'Bienvenue chez Tanuki.',
      subtitle: login ? 'Retrouvez vos commandes, votre wishlist et votre avoir.' : 'Créez un compte pour suivre vos commandes et votre wishlist.',
      cta: login ? 'Se connecter' : 'Créer mon compte',
      goLogin: () => this.setState({ mode: 'login', touched: false }),
      goRegister: () => this.setState({ mode: 'register', touched: false }),
      loginTabBg: login ? '#1A1611' : 'transparent', loginTabFg: login ? '#E8E1D8' : '#1A1611',
      regTabBg: !login ? '#1A1611' : 'transparent', regTabFg: !login ? '#E8E1D8' : '#1A1611',
      email: this.state.email, pwd: this.state.pwd,
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPwd: (e) => this.setState({ pwd: e.target.value }),
      emailErr, pwdErr,
      emailBorder: emailErr ? '#8A2F1D' : 'rgba(26,22,17,0.15)',
      pwdBorder: pwdErr ? '#8A2F1D' : 'rgba(26,22,17,0.15)',
      submit: () => this.setState({ touched: true }),
    };
  }
}
</script>
</body>
</html>
