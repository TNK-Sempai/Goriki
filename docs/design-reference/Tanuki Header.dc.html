<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky; top:16px; z-index:50; max-width:1360px; margin:16px auto 0; display:flex; align-items:center; justify-content:space-between; padding:14px 28px; background:rgba(248,244,236,0.55); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.65); border-radius:4px; box-shadow:0 8px 32px -12px rgba(26,22,17,0.18); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <a href="Tanuki Accueil.dc.html" style="font-size:18px; font-weight:600; letter-spacing:-0.01em; color:#1A1611; text-decoration:none;">Tanuki <span style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:400; letter-spacing:0.2em; vertical-align:middle; margin-left:6px;">TCG</span></a>
  <nav style="display:flex; gap:6px; font-size:13px;">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
      <a href="{{ it.href }}" style="padding:8px 14px; border-radius:4px; color:#1A1611; text-decoration:none; background:{{ it.bg }};" style-hover="background:rgba(26,22,17,0.06);">{{ it.label }}</a>
    </sc-for>
  </nav>
  <div style="display:flex; gap:10px; align-items:center;">
    <a href="#" style="font-size:13px; padding:8px 16px; background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.7); border-radius:4px; color:rgba(26,22,17,0.6); text-decoration:none;">Rechercher…</a>
    <a href="Tanuki Compte.dc.html" style="font-size:13px; padding:8px 14px; border-radius:4px; color:#1A1611; text-decoration:none;" style-hover="background:rgba(26,22,17,0.06);">Compte</a>
    <a href="Tanuki Panier.dc.html" style="font-family:'JetBrains Mono',monospace; font-size:11px; padding:9px 14px; background:rgba(26,22,17,0.9); color:#E8E1D8; border-radius:4px; text-decoration:none;">PANIER · 2</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1360, &quot;height&quot;: 90}, &quot;active&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? '';
    return {
      items: [
        { label: 'One Piece', href: 'Tanuki One Piece.dc.html' },
        { label: 'Pokémon', href: 'Tanuki Pokemon.dc.html' },
        { label: 'Dépôt-vente', href: '#' },
        { label: 'Rachat', href: '#' },
        { label: 'Want to Buy', href: '#' },
      ].map(it => ({ ...it, bg: it.label.toLowerCase() === active.toLowerCase() ? 'rgba(26,22,17,0.08)' : 'transparent' })),
    };
  }
}
</script>
</body>
</html>
